<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - My PvPGN Server</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

    <div class="page">

        <div class="card">

            <div class="logo">
                PvPGN
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Register your Battle.net account
            </p>


            <form id="registerForm">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    minlength="3"
                    maxlength="15"
                    required
                    autocomplete="username"
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="6"
                    maxlength="12"
                    required
                    autocomplete="new-password"
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    minlength="6"
                    maxlength="12"
                    required
                    autocomplete="new-password"
                >


                <label>
                    Gmail Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="you@gmail.com"
                >


                <div class="rules">

                    <div>
                        ✓ Username: 3-15 characters
                    </div>

                    <div>
                        ✓ Password: 6-12 characters
                    </div>

                    <div>
                        ✓ Gmail address required (one account per Gmail)
                    </div>

                </div>


                <button type="submit">
                    Create Account
                </button>


                <p class="forgot-pw">
                    <a href="https://dota-and-friends-web.dotaandfriends.workers.dev/forgot-password">Forgot your password?</a>
                </p>


                <div
                    id="message"
                    class="message"
                ></div>

            </form>

        </div>

    </div>


    <script src="/app.js"></script>

</body>

</html>
